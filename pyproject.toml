[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gta-text-classification-repro"
version = "0.1.0"
description = "A paper-faithful, inspectable reproduction of GTA for LLM text classification"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.24",
  "scikit-learn>=1.3",
  "torch>=2.1",
]

[project.optional-dependencies]
train = [
  "datasets>=3.0",
  "peft>=0.12",
  "pyyaml>=6.0",
  "transformers>=4.45",
]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
